name: ${COMPOSE_PROJECT_NAME:?Set a distinct deployment project name}

services:
  database:
    image: ${POSTGRES_IMAGE:-postgres:17}
    container_name: ${DB_CONTAINER_NAME:?Set the target database container name}
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?Set the PostgreSQL database name}
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_ADMIN_PASSWORD:?Set a separate PostgreSQL administrator password}
      POSTGRES_INITDB_ARGS: --auth-host=scram-sha-256
      DB_USER: ${DB_USER:?Set the non-superuser application role}
      DB_PASSWORD: ${DB_PASSWORD:?Set the application database password}
      TZ: UTC
    ports:
      - "127.0.0.1:${DB_HOST_PORT:?Set the target loopback database port}:5432"
    volumes:
      - type: bind
        source: ${POSTGRES_DATA_DIR:?Set a NEW PostgreSQL data directory, never the MariaDB directory}
        target: /var/lib/postgresql/data
        bind:
          create_host_path: false
      - type: bind
        source: ./postgres/001-app-role.sh
        target: /docker-entrypoint-initdb.d/001-app-role.sh
        read_only: true
        bind:
          create_host_path: false
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -h 127.0.0.1 -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"']
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    networks:
      - database

  # Exactly one replica by design: schedulers take no distributed lock and the sport
  # notification alternation phase lives in process memory. Do not scale this service.
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    image: ${BACKEND_IMAGE:?Set a deployment-specific backend image name}
    container_name: ${APP_CONTAINER_NAME:?Set the target application container name}
    restart: unless-stopped
    depends_on:
      database:
        condition: service_healthy
    environment:
      DB_URL: jdbc:postgresql://database:5432/${POSTGRES_DB:?Set the PostgreSQL database name}
      DB_USER: ${DB_USER:?Set the non-superuser application role}
      DB_PASSWORD: ${DB_PASSWORD:?Set the application database password}
      FIREBASE_KEY_PATH: /run/secrets/firebase-service-account.json
      MY_ITMO_REFRESH_TOKEN: ${MY_ITMO_REFRESH_TOKEN:-}
      ISU_KEYCLOAK_IDENTITY: ${ISU_KEYCLOAK_IDENTITY:-}
      APP_VERSION: ${APP_VERSION:-2.1}
      MIN_APP_VERSION: ${MIN_APP_VERSION:-2.1}
      APP_VERSION_NOTE: ${APP_VERSION_NOTE:-}
      REVIEWS_SYNC_ENABLED: ${REVIEWS_SYNC_ENABLED:-false}
      AI_SUMMARY_ENABLED: ${AI_SUMMARY_ENABLED:-false}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-}
      GEMINI_PROXY_HOST: gemini-proxy
      GEMINI_PROXY_PORT: "3128"
      AI_SUMMARY_DAILY_BUDGET: ${AI_SUMMARY_DAILY_BUDGET:-0}
      AI_SUMMARY_REQUEST_DELAY: ${AI_SUMMARY_REQUEST_DELAY:-10s}
      GEMINI_THINKING_BUDGET: ${GEMINI_THINKING_BUDGET:-}
      GEMINI_MAX_OUTPUT_TOKENS: ${GEMINI_MAX_OUTPUT_TOKENS:-2048}
    volumes:
      - type: bind
        source: ${FIREBASE_KEY_FILE:?Set the target environment Firebase service-account file}
        target: /run/secrets/firebase-service-account.json
        read_only: true
        bind:
          create_host_path: false
    expose:
      - "8080"
    networks:
      - database
      - web
      - gemini

  # Forwards only generativelanguage.googleapis.com to the owner's egress and blocks everything else.
  # Backend starts without it: only the Gemini client uses the proxy. The config holds egress keys.
  gemini-proxy:
    image: ghcr.io/xtls/xray-core:26.2.6
    container_name: ${GEMINI_PROXY_CONTAINER_NAME:?Set the Gemini proxy container name}
    restart: unless-stopped
    command: ["run", "-config", "/etc/xray/config.json"]
    volumes:
      - type: bind
        source: ./gemini-proxy/config.json
        target: /etc/xray/config.json
        read_only: true
        bind:
          create_host_path: false
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - "no-new-privileges:true"
    mem_limit: 128m
    networks:
      - gemini
      - gemini-egress

networks:
  database:
    internal: true
  gemini:
    internal: true
  gemini-egress: {}
  web:
    external: true
    name: web
