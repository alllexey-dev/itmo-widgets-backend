spring.application.name=ITMO.Widgets-backend
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
# Flyway is the only schema writer, including local development.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
# Hibernate prints raw driver messages on a path nothing here controls. The application handlers
# decide instead: a redacted line, plus the cause chain attached deliberately for operators.
logging.level.org.hibernate.engine.jdbc.spi.SqlExceptionHelper=OFF
spring.sql.init.mode=never
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.validate-on-migrate=true
spring.flyway.validate-migration-naming=true
# The v2.1 reset starts from an empty PostgreSQL database, never an implicit baseline.
spring.flyway.baseline-on-migrate=false
spring.flyway.clean-disabled=true
server.port=8080

firebase.key.path=${FIREBASE_KEY_PATH}
id.itmo.jwks-url=https://id.itmo.ru/auth/realms/itmo/protocol/openid-connect/certs
id.itmo.issuer=https://id.itmo.ru/auth/realms/itmo
# ITMO.ID clients (`azp`) whose tokens are expected: the app signs in as MyITMO's own client (MyItmoApi
# MyItmoConfiguration). `log` accepts every client and logs hourly counts; `enforce` rejects the others.
id.itmo.allowed-clients=student-personal-cabinet,student-personal-cabinet-dev
id.itmo.azp-mode=log

itmowidgets.app.version=${APP_VERSION:2.1}
itmowidgets.app.min-version=${MIN_APP_VERSION:2.1}
itmowidgets.app.note=${APP_VERSION_NOTE:}
itmowidgets.app.ios.version=${IOS_APP_VERSION:2.3}
itmowidgets.app.ios.min-version=${IOS_MIN_APP_VERSION:2.3}
itmowidgets.app.ios.note=${IOS_APP_VERSION_NOTE:}

itmowidgets.my-itmo.refresh-token=${MY_ITMO_REFRESH_TOKEN:}

# Browser sessions (iw_session): idle limit without requests, absolute limit after sign-in
# and the sign-in age up to which admin and moderation routes accept the session.
itmowidgets.web-session.idle-timeout=${WEB_SESSION_IDLE_TIMEOUT:14d}
itmowidgets.web-session.max-lifetime=${WEB_SESSION_MAX_LIFETIME:60d}
itmowidgets.web-session.admin-max-age=${WEB_SESSION_ADMIN_MAX_AGE:12h}

# Only technical refresh logs expire; user history and the sport catalog are retained.
itmowidgets.retention.sport-update-log-days=${SPORT_UPDATE_LOG_RETENTION_DAYS:90}
itmowidgets.retention.batch-size=${TECHNICAL_LOG_RETENTION_BATCH_SIZE:1000}

# Copies teacher reviews from the Reviews project daily; enabled only where the environment asks for it.
itmowidgets.reviews-sync.enabled=${REVIEWS_SYNC_ENABLED:false}
itmowidgets.reviews-sync.base-url=${REVIEWS_SYNC_BASE_URL:https://reviews.work.gd}
itmowidgets.reviews-sync.request-delay=${REVIEWS_SYNC_REQUEST_DELAY:1500ms}
itmowidgets.reviews-sync.connect-timeout=10s
itmowidgets.reviews-sync.request-timeout=30s

# ISU pages for the "taught the author" check of own teacher reviews. The cookie only seeds the
# ISU_KEYCLOAK_IDENTITY row of service_credentials, which holds the current value.
itmowidgets.isu.keycloak-identity=${ISU_KEYCLOAK_IDENTITY:}
itmowidgets.isu.base-url=https://isu.ifmo.ru
itmowidgets.isu.identity-url=https://id.itmo.ru/auth/realms/itmo/
itmowidgets.isu.request-delay=2s
itmowidgets.isu.connect-timeout=10s
itmowidgets.isu.request-timeout=30s

# AI summaries of teacher reviews through the Gemini API, reached only through the gemini-proxy sidecar.
# The key only seeds the GEMINI_API_KEY row of service_credentials, which holds the current value.
itmowidgets.ai-summary.enabled=${AI_SUMMARY_ENABLED:false}
itmowidgets.ai-summary.api-key=${GEMINI_API_KEY:}
itmowidgets.ai-summary.model=${GEMINI_MODEL:}
itmowidgets.ai-summary.proxy-host=${GEMINI_PROXY_HOST:}
itmowidgets.ai-summary.proxy-port=${GEMINI_PROXY_PORT:3128}
itmowidgets.ai-summary.daily-request-budget=${AI_SUMMARY_DAILY_BUDGET:0}
itmowidgets.ai-summary.request-delay=${AI_SUMMARY_REQUEST_DELAY:10s}
itmowidgets.ai-summary.thinking-budget=${GEMINI_THINKING_BUDGET:}
itmowidgets.ai-summary.max-output-tokens=${GEMINI_MAX_OUTPUT_TOKENS:2048}
itmowidgets.ai-summary.base-url=https://generativelanguage.googleapis.com
itmowidgets.ai-summary.budget-zone=America/Los_Angeles
itmowidgets.ai-summary.connect-timeout=10s
itmowidgets.ai-summary.request-timeout=90s

