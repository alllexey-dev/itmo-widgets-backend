spring.application.name=ITMO.Widgets-backend
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
# Flyway is the only schema writer, including local development.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
# Hibernate prints raw driver messages on a path nothing here controls. The application handlers
# decide instead: a redacted line, plus the cause chain attached deliberately for operators.
logging.level.org.hibernate.engine.jdbc.spi.SqlExceptionHelper=OFF
spring.sql.init.mode=never
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.validate-on-migrate=true
spring.flyway.validate-migration-naming=true
# The v2.1 reset starts from an empty PostgreSQL database, never an implicit baseline.
spring.flyway.baseline-on-migrate=false
spring.flyway.clean-disabled=true
server.port=8080

firebase.key.path=${FIREBASE_KEY_PATH}
id.itmo.jwks-url=https://id.itmo.ru/auth/realms/itmo/protocol/openid-connect/certs
id.itmo.issuer=https://id.itmo.ru/auth/realms/itmo

itmowidgets.app.version=${APP_VERSION:2.1}
itmowidgets.app.min-version=${MIN_APP_VERSION:2.1}
itmowidgets.app.note=${APP_VERSION_NOTE:}

itmowidgets.my-itmo.refresh-token=${MY_ITMO_REFRESH_TOKEN:}

# Only technical refresh logs expire; user history and the sport catalog are retained.
itmowidgets.retention.sport-update-log-days=${SPORT_UPDATE_LOG_RETENTION_DAYS:90}
itmowidgets.retention.batch-size=${TECHNICAL_LOG_RETENTION_BATCH_SIZE:1000}

