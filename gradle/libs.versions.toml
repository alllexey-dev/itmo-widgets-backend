# Every version of the build. Spring Boot's BOM manages the version-less libraries.

[versions]
kotlin = "2.2.21"
# Spring Framework 7, Jackson 3, Hibernate 7, Testcontainers 2; Kotlin stays on the plugin's version.
spring-boot = "4.1.1"
spring-dependency-management = "1.1.7"
ktlint-gradle = "14.2.0"
ktlint-cli = "1.8.0"
my-itmo-api = "2.0.0"
# The versions MyItmoApi 2.0.0 is built on; its public API names their types.
ktor = "3.6.0"
kotlinx-datetime = "0.8.0"
# Raises the Spring Boot BOM's kotlin-coroutines.version, which Ktor 3.6 is newer than.
kotlinx-coroutines = "1.11.0"
java-jwt = "4.5.0"
jwks-rsa = "0.23.0"
firebase-admin = "9.7.0"
jsoup = "1.21.1"
# Spring Boot 4 no longer manages spring-retry; 2.0.13 is the last version Spring Boot 3.5 managed.
spring-retry = "2.0.13"
konsist = "0.17.3"
# Test scope only: the OpenAPI snapshot (docs/openapi.json). 3.1.x is the Spring Boot 4.1 line.
springdoc = "3.1.1"
# compileOnly: the @Schema annotations main code carries for the snapshot; the version springdoc brings.
swagger-annotations = "2.2.55"
# Released Core for the compat suites only; the 1.2.0 suite goes when app.minimum reaches 2.2.
itmo-widgets-core-v120 = "1.2.0"
itmo-widgets-core-v170 = "1.7.0"

[libraries]
my-itmo-api = { module = "dev.alllexey:my-itmo-api-kmp", version.ref = "my-itmo-api" }
ktor-client-core = { module = "io.ktor:ktor-client-core", version.ref = "ktor" }
ktor-client-mock = { module = "io.ktor:ktor-client-mock", version.ref = "ktor" }
kotlinx-datetime = { module = "org.jetbrains.kotlinx:kotlinx-datetime", version.ref = "kotlinx-datetime" }
kotlinx-coroutines-core = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core" }
java-jwt = { module = "com.auth0:java-jwt", version.ref = "java-jwt" }
jwks-rsa = { module = "com.auth0:jwks-rsa", version.ref = "jwks-rsa" }
firebase-admin = { module = "com.google.firebase:firebase-admin", version.ref = "firebase-admin" }
jsoup = { module = "org.jsoup:jsoup", version.ref = "jsoup" }
spring-boot-starter-data-jpa = { module = "org.springframework.boot:spring-boot-starter-data-jpa" }
spring-boot-starter-webmvc = { module = "org.springframework.boot:spring-boot-starter-webmvc" }
spring-boot-starter-security = { module = "org.springframework.boot:spring-boot-starter-security" }
spring-boot-starter-aspectj = { module = "org.springframework.boot:spring-boot-starter-aspectj" }
spring-boot-starter-flyway = { module = "org.springframework.boot:spring-boot-starter-flyway" }
spring-boot-starter-test = { module = "org.springframework.boot:spring-boot-starter-test" }
spring-boot-starter-webmvc-test = { module = "org.springframework.boot:spring-boot-starter-webmvc-test" }
spring-boot-starter-data-jpa-test = { module = "org.springframework.boot:spring-boot-starter-data-jpa-test" }
spring-boot-starter-security-test = { module = "org.springframework.boot:spring-boot-starter-security-test" }
spring-retry = { module = "org.springframework.retry:spring-retry", version.ref = "spring-retry" }
jackson-module-kotlin = { module = "tools.jackson.module:jackson-module-kotlin" }
# Test scope only: springdoc reads schemas through swagger-core's Jackson 2, which needs Jackson 2's Kotlin module.
jackson2-module-kotlin = { module = "com.fasterxml.jackson.module:jackson-module-kotlin" }
kotlin-reflect = { module = "org.jetbrains.kotlin:kotlin-reflect" }
kotlin-test-junit5 = { module = "org.jetbrains.kotlin:kotlin-test-junit5" }
junit-platform-launcher = { module = "org.junit.platform:junit-platform-launcher" }
flyway-database-postgresql = { module = "org.flywaydb:flyway-database-postgresql" }
postgresql = { module = "org.postgresql:postgresql" }
testcontainers-postgresql = { module = "org.testcontainers:testcontainers-postgresql" }
konsist = { module = "com.lemonappdev:konsist", version.ref = "konsist" }
springdoc-openapi-starter-webmvc-api = { module = "org.springdoc:springdoc-openapi-starter-webmvc-api", version.ref = "springdoc" }
swagger-annotations-jakarta = { module = "io.swagger.core.v3:swagger-annotations-jakarta", version.ref = "swagger-annotations" }
itmo-widgets-core-v120 = { module = "dev.alllexey:itmo-widgets-core", version.ref = "itmo-widgets-core-v120" }
itmo-widgets-core-v170 = { module = "dev.alllexey:itmo-widgets-core", version.ref = "itmo-widgets-core-v170" }

[plugins]
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
kotlin-spring = { id = "org.jetbrains.kotlin.plugin.spring", version.ref = "kotlin" }
kotlin-jpa = { id = "org.jetbrains.kotlin.plugin.jpa", version.ref = "kotlin" }
spring-boot = { id = "org.springframework.boot", version.ref = "spring-boot" }
spring-dependency-management = { id = "io.spring.dependency-management", version.ref = "spring-dependency-management" }
ktlint = { id = "org.jlleitschuh.gradle.ktlint", version.ref = "ktlint-gradle" }
