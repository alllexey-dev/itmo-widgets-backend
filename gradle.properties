kotlin.code.style=official
# Many agents build side by side: an idle daemon frees its memory after 30 minutes, not 3 hours.
org.gradle.daemon.idletimeout=1800000
# Tests that read files outside their classpath declare them as task inputs (build.gradle.kts),
# so a cached result is reused only when those files are unchanged too.
org.gradle.caching=true
